<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="Tribute Page.css" rel="stylesheet">
</head>

<body>
    <main id="main">

        <h1 id="title">
            Dr. Norman Borlaug
        </h1>

        <figure id="img-div">

            <img id="image" src="https://cdn.freecodecamp.org/testable-projects-fcc/images/tribute-page-main-image.jpg"
                alt="Dr. Norman Borlaug">

            <figcaption id="img-caption">
                Dr. Norman Borlaug teaching scientists in the field.
            </figcaption>

        </figure>

        <section id="tribute-info">

            <p>
                Dr. Norman Borlaug was an American agronomist known for leading efforts that helped prevent famine
                around the world.
            </p>

            <p>
                His research in agriculture earned him the Nobel Peace Prize in 1970.
            </p>

        </section>

        <a id="tribute-link" href="https://en.wikipedia.org/wiki/Norman_Borlaug" target="_blank">
            Learn more about Dr. Norman Borlaug
        </a>

    </main>

</body>

</html>
